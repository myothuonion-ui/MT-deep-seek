name: Bootstrap hardened source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[hardened-bootstrap]') }}
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_REPO: https://github.com/KhitMinnyo/KMN-CyberSeek.git
      UPSTREAM_COMMIT: 3e8b08a36c6af989f30c1d564f1a1c00579dbf43
      ALLOW_UNSCOPED_TARGETS: "true"
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import pinned upstream tree
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --no-tags "$UPSTREAM_REPO" "$tmp/upstream"
          git -C "$tmp/upstream" checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C "$tmp/upstream" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'scripts' \
            "$tmp/upstream/" "$GITHUB_WORKSPACE/"

      - name: Apply deterministic security hardening
        run: python scripts/harden_upstream.py

      - name: Normalize generated hardened source
        run: python scripts/post_harden_fix.py

      - name: Add hardened repository banner
        shell: python
        run: |
          from pathlib import Path
          p = Path("README.md")
          body = p.read_text(encoding="utf-8")
          banner = """# MT-deep-seek — Hardened KMN-CyberSeek\n\n> Security-hardened derivative pinned to upstream KMN-CyberSeek v2.3.3 (`3e8b08a...`). See `SECURITY_HARDENING.md`. Authorized security testing only.\n\n"""
          if not body.startswith("# MT-deep-seek"):
              p.write_text(banner + body, encoding="utf-8")

      - name: Install dependencies and security tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff bandit pip-audit
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > requirements.lock

      - name: Security regression gate
        run: python scripts/security_gate.py

      - name: Compile and run test suites
        shell: bash
        run: |
          python -m compileall -q ai core main.py frontend.py
          python tests/run_tests.py
          python -m pytest -q
          ruff check . --select E9,F63,F7,F82

      - name: Advisory dependency and static security reports
        shell: bash
        run: |
          pip-audit -r requirements.lock -f json -o pip-audit.json || true
          bandit -q -r ai core main.py -x tests -f json -o bandit-report.json || true

      - name: Commit hardened full tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hardened tree changes to commit."
            exit 0
          fi
          git commit -m "build: import pinned upstream + security hardening [hardened-bootstrap]"
          git push origin HEAD:main
