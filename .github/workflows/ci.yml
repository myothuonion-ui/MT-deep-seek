name: CI and security gates

on:
  push:
    branches: [main, "agent/**", "feature/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ALLOW_UNSCOPED_TARGETS: "true" # test fixtures only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact dependency snapshot
        shell: bash
        run: |
          python -m pip install --no-deps -r requirements.lock
          python -m pip check
      - name: Reproducibility gate
        run: python scripts/verify_reproducible.py
      - name: Security gate
        run: python scripts/security_gate.py
      - name: Brand independence gate
        run: python scripts/brand_gate.py
      - name: Compile
        run: python -m compileall -q adapters ai core main.py frontend.py scripts benchmarks
      - name: Regression suite
        run: python tests/run_tests.py
      - name: Local Web assessment integration
        run: python -m unittest tests.test_web_assessment -v
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff correctness checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Dependency vulnerability gate
        run: pip-audit -r requirements.lock -f json -o pip-audit.json
      - name: Bandit advisory scan
        run: bandit -q -r ai core main.py scripts -x tests -f json -o bandit-report.json || true
      - name: Build hardened runtime image
        run: docker build -f Dockerfile.hardened -t mt-pentester:hardened-ci .
      - name: Hardened image toolchain smoke check
        run: |
          docker run --rm --entrypoint python mt-pentester:hardened-ci scripts/verify_reproducible.py
          docker run --rm --entrypoint nmap mt-pentester:hardened-ci --version
          docker run --rm --entrypoint nuclei mt-pentester:hardened-ci -version
          docker run --rm --entrypoint python mt-pentester:hardened-ci -c \
            "from adapters import NucleiAdapter, ClaudeBugHunterAdapter; assert NucleiAdapter().status()['available']; assert NucleiAdapter().status()['templates_configured']; assert ClaudeBugHunterAdapter().status()['available']; print('adapter runtime smoke: PASS')"
      - name: Real non-root container and Nmap smoke test
        shell: bash
        run: |
          set -euo pipefail
          name="mt-pentester-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "$name" > container-smoke.log 2>&1 || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$name" \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --tmpfs /home/mt/.cache:rw,nosuid,nodev,size=64m,mode=0700 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,mode=0700,uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            -e API_AUTH_TOKEN=ci-only-not-a-secret \
            -e SCOPE_ALLOWLIST=127.0.0.1 \
            -e ALLOW_UNSCOPED_TARGETS=false \
            mt-pentester:hardened-ci
          ready=false
          for _ in $(seq 1 60); do
            if docker exec "$name" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health', timeout=2).read()"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$name"
            exit 1
          fi
          test "$(docker exec "$name" id -u)" = "10001"
          docker exec "$name" nmap -sT -Pn -n -p 6000 127.0.0.1 | tee nmap-smoke.txt
          grep -Eq '6000/tcp[[:space:]]+open' nmap-smoke.txt
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-advisory-reports
          path: |
            pip-audit.json
            bandit-report.json
            container-smoke.log
            nmap-smoke.txt
          if-no-files-found: ignore

