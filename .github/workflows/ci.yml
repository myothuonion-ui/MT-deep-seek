name: CI and security gates

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ALLOW_UNSCOPED_TARGETS: "true" # test fixtures only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            python -m pip install -r requirements.lock
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install ruff bandit pip-audit
          python -m pip check
      - name: Security gate
        run: python scripts/security_gate.py
      - name: Compile
        run: python -m compileall -q ai core main.py frontend.py
      - name: Regression suite
        run: python tests/run_tests.py
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff correctness checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Advisory security scans
        shell: bash
        run: |
          pip-audit -r requirements.lock -f json -o pip-audit.json || true
          bandit -q -r ai core main.py -x tests -f json -o bandit-report.json || true
      - name: Upload advisory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-advisory-reports
          path: |
            pip-audit.json
            bandit-report.json
          if-no-files-found: ignore
